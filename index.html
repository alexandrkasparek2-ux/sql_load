<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#050505" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CycloFuel" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>CycloFuel – Nutriční tracker pro cyklisty</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { height: 100%; }
      body {
        background: #050505;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
        min-height: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      #root {
        max-width: 500px;
        margin: 0 auto;
        min-height: 100dvh;
        position: relative;
        background: #050505;
      }
      input, button, select, textarea { font-family: inherit; }
      input[type=range] {
        -webkit-appearance: none;
        appearance: none;
        height: 6px;
        border-radius: 3px;
        cursor: pointer;
        width: 100%;
        outline: none;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid #050505;
      }
      input[type=range]::-moz-range-thumb {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid #050505;
      }
      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #252525; border-radius: 2px; }
      * { -webkit-tap-highlight-color: transparent; }

      /* ── Keyframe animations ─────────────────────────────── */
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(15px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.4; }
      }
      @keyframes pulse-scale {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.5; transform: scale(1.1); }
      }
      @keyframes ring-fill {
        from { stroke-dashoffset: var(--ring-circ, 534); }
      }
      @keyframes shimmer {
        0%   { background-position: -200% 0; }
        100% { background-position:  200% 0; }
      }
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255, 214, 0, 0.4); }
        50%       { box-shadow: 0 0 0 8px rgba(255, 214, 0, 0); }
      }

      /* ── Stagger helpers ─────────────────────────────────── */
      .stagger-1 { animation: fadeInUp 0.5s ease-out 0.05s both; }
      .stagger-2 { animation: fadeInUp 0.5s ease-out 0.15s both; }
      .stagger-3 { animation: fadeInUp 0.5s ease-out 0.25s both; }
      .stagger-4 { animation: fadeInUp 0.5s ease-out 0.35s both; }
      .stagger-5 { animation: fadeInUp 0.5s ease-out 0.45s both; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
