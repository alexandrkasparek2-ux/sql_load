<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CycloFuel" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <title>CycloFuel – Nutriční tracker pro cyklisty</title>
    <style>
      :root {
        --bg:        #0b0b0c;
        --bg-2:      #131315;
        --surface:   #18181b;
        --surface-2: #1f1f23;
        --line:      #26262b;
        --line-2:    #34343a;
        --text:      #f5f5f4;
        --text-2:    #a8a8a3;
        --text-3:    #6b6b67;
        --accent:    #ff5b1f;
        --accent-2:  #ffb000;
        --good:      #7dd87a;
        --bad:       #ff5566;
        --carb:      #ffb000;
        --fat:       #ff5b1f;
        --pro:       #d6f25c;
        --hyd:       #4cc9ff;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        min-height: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      #root {
        width: 100%;
        min-height: 100dvh;
        position: relative;
        background: var(--bg);
      }
      .display      { font-family: 'Space Grotesk', 'Inter', sans-serif; }
      .mono         { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
      .num-tabular  { font-variant-numeric: tabular-nums; }
      .eyebrow      { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--text-3); }
      .slide-up     { animation: slideUp 0.35s ease both; }

      input, button, select, textarea { font-family: inherit; }
      input[type=range] {
        -webkit-appearance: none;
        appearance: none;
        height: 6px;
        border-radius: 3px;
        cursor: pointer;
        width: 100%;
        outline: none;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid #050505;
      }
      input[type=range]::-moz-range-thumb {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid #050505;
      }
      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #252525; border-radius: 2px; }
      * { -webkit-tap-highlight-color: transparent; }

      /* ── Keyframe animations ─────────────────────────────── */
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(15px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.4; }
      }
      @keyframes pulse-scale {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.5; transform: scale(1.1); }
      }
      @keyframes ring-fill {
        from { stroke-dashoffset: var(--ring-circ, 534); }
      }
      @keyframes shimmer {
        0%   { background-position: -200% 0; }
        100% { background-position:  200% 0; }
      }
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255, 91, 31, 0.4); }
        50%       { box-shadow: 0 0 0 8px rgba(255, 91, 31, 0); }
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes slideInUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes cardReveal {
        from { opacity: 0; transform: translateY(12px) scale(0.98); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes liveBlip {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255,82,82,0.5); }
        50%       { box-shadow: 0 0 0 6px rgba(255,82,82,0); }
      }
      @keyframes tabSlide {
        from { opacity: 0; transform: translateX(8px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      @keyframes numberPop {
        0%   { transform: scale(0.85); opacity: 0; }
        60%  { transform: scale(1.05); }
        100% { transform: scale(1); opacity: 1; }
      }

      /* ── Stagger helpers ─────────────────────────────────── */
      .stagger-1 { animation: fadeInUp 0.5s ease-out 0.05s both; }
      .stagger-2 { animation: fadeInUp 0.5s ease-out 0.15s both; }
      .stagger-3 { animation: fadeInUp 0.5s ease-out 0.25s both; }
      .stagger-4 { animation: fadeInUp 0.5s ease-out 0.35s both; }
      .stagger-5 { animation: fadeInUp 0.5s ease-out 0.45s both; }

      /* ── Tap feedback ────────────────────────────────────── */
      button:active:not(:disabled) { transform: scale(0.97); transition: transform 0.08s ease; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
