name: cycling-coach-bot CI

on:
  push:
    branches: [main]
    paths:
      - 'cycling-coach-bot/**'
      - '.github/workflows/cycling-coach-bot.yml'
  pull_request:
    paths:
      - 'cycling-coach-bot/**'
      - '.github/workflows/cycling-coach-bot.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cycling-coach-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cycling-coach-bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
