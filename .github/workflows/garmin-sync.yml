name: Garmin daily sync

on:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC every morning
  workflow_dispatch:        # manual trigger from Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r garmin/requirements.txt

      - name: Run Garmin sync
        env:
          GARMIN_TOKEN_B64: ${{ secrets.GARMIN_TOKEN_B64 }}
          GARMIN_INGEST_URL: ${{ secrets.GARMIN_INGEST_URL }}
          GARMIN_INGEST_SECRET: ${{ secrets.GARMIN_INGEST_SECRET }}
        run: |
          if [ -n "$GARMIN_INGEST_URL" ]; then
            python garmin/sync_garmin.py --days 3 --sink supabase
          else
            python garmin/sync_garmin.py --days 3 --sink files --out ./garmin/output
          fi

      - name: Commit file changes (files mode only)
        if: ${{ !env.GARMIN_INGEST_URL }}
        env:
          GARMIN_INGEST_URL: ${{ secrets.GARMIN_INGEST_URL }}
        run: |
          git config user.name "garmin-sync[bot]"
          git config user.email "garmin-sync[bot]@users.noreply.github.com"
          git add garmin/output/
          git diff --cached --quiet || git commit -m "chore: garmin data $(date -u +%F)"
          git push
